name: Check library

# Kalibre reads this repository's default branch directly, so these checks run
# on every pull request and every push to it (see scripts/check-library.mjs).
# Make "check" a required status check on the default branch so a failing
# library can't be merged.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the library
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            node scripts/check-library.mjs --base "origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            node scripts/check-library.mjs --base "$BEFORE_SHA"
          else
            node scripts/check-library.mjs
          fi
