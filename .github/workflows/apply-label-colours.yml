name: Apply issue label colours

on:
  push:
    paths:
      - .github/workflows/apply-label-colours.yml
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: apply-issue-label-colours
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Update label colour definitions
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              ["area:fixture-integrity", "1F6FEB"],
              ["state:needs-validation", "1B7C83"],
              ["type:maintenance", "8250DF"],
              ["impact:medium", "BF8700"],
            ];

            for (const [name, color] of labels) {
              try {
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                });
                core.info(`Updated ${name} -> #${color}`);
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                });
                core.info(`Created ${name} -> #${color}`);
              }
            }
